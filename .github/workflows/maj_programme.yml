name: Extraction TV Matinale

on:
  schedule:
    # Déclenchement automatique tous les matins à 4h00 UTC (5h00 du matin en France)
    - cron: '0 4 * * *'
  workflow_dispatch: # Permet de forcer manuellement le démarrage d'un clic

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
    - name: Récupération du projet
      uses: actions/checkout@v3

    - name: Configuration de Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Lancement du nettoyage des chaînes
      run: python update_tv.py

    - name: Enregistrement et mise à jour des données
      run: |
        git config --global user.name 'Robot TV'
        git config --global user.email 'robot@tv.com'
        git add programmes.json
        git commit -m "Mise à jour matinale des programmes" || exit 0
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
